# nginx reverse proxy for orders-staging.bemytea.shop -> Next.js on 127.0.0.1:3000
# Install at /etc/nginx/sites-available/orders-staging.bemytea.shop
# then: ln -s /etc/nginx/sites-available/orders-staging.bemytea.shop /etc/nginx/sites-enabled/
# certbot rewrites this file in place to add the TLS server block on first run.

server {
    listen 80;
    listen [::]:80;
    server_name orders-staging.bemytea.shop;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
